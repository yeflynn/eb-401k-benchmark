name: keep-alive

# Keeps the Streamlit Community Cloud app awake by pinging it every 6 hours.
# Community Cloud sleeps after ~12h of inactivity; a plain GET wakes it.
on:
  schedule:
    - cron: "7 */6 * * *"  # every 6 hours, at minute 7
  workflow_dispatch:  # allow manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the Streamlit app
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 120 \
            -A "Mozilla/5.0 (keep-alive)" \
            "https://eb-401k-benchmark.streamlit.app")
          echo "HTTP status: $code"
